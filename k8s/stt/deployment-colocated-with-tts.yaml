# ALTERNATIVE to k8s/stt/deployment.yaml + k8s/tts/deployment.yaml, for use
# ONLY if two separate Deployments each requesting nvidia.com/gpu: 1 cannot
# both schedule onto one node's single GPU (confirmed directly: node3 gave
# `UnexpectedAdmissionError ... Available: 0` when both speech-stt and
# speech-tts were scaled up at once — see docs/deployment.md "Status").
#
# In that case, STT+TTS must be a single Pod with two containers sharing the
# one GPU device the Pod requests, not two independent Deployments. Apply
# this INSTEAD OF k8s/stt/deployment.yaml and k8s/tts/deployment.yaml.
#
# Retargeted at node3 (2026-09-09): node2 is currently running speech-llm,
# and node3 is where speech-stt/speech-tts's model caches already live
# (/mnt/local-fast/{parakeet-model,tts-model}), so this uses the same
# hostPath mounts and env vars as the working standalone Deployments instead
# of the stale models-node2 PVC / stt-config/tts-config ConfigMaps (those
# still reference TTS_BACKEND=ggml and HF_HUB_OFFLINE=0, neither of which
# matches the working torch-backend/offline setup — refresh them before
# switching this manifest back to envFrom).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-stt-tts
  namespace: speech
  labels:
    app: speech-stt-tts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speech-stt-tts
  template:
    metadata:
      labels:
        app: speech-stt-tts
    spec:
      runtimeClassName: nvidia
      nodeName: node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-stt
          image: local-registry:5000/speech-stt:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: STT_MODEL_NAME
              value: "nvidia/parakeet-tdt-0.6b-v3"
            - name: STT_DEVICE
              value: "cuda"
            - name: HF_HOME
              value: "/models"
            - name: TRANSFORMERS_CACHE
              value: "/models"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8001
          resources:
            # Only ONE container in this Pod declares the GPU request/limit —
            # both processes still see the same physical device via
            # NVIDIA_VISIBLE_DEVICES once the Pod is scheduled, since GPU
            # visibility is a Pod-level (not per-container) grant under the
            # device plugin.
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: stt-models
              mountPath: /models
          startupProbe:
            httpGet:
              path: /healthz
              port: 8001
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 20
            failureThreshold: 3
        - name: speech-tts
          image: local-registry:5000/speech-tts:voicefix6
          imagePullPolicy: IfNotPresent
          env:
            - name: TTS_MODEL_NAME
              value: "/models"
            - name: TTS_DEVICE
              value: "cuda"
            - name: TTS_BACKEND
              value: "torch"
            # Explicit here rather than relying on tts/Dockerfile's ENV
            # default - the demo's voice dropdown offers all of these
            # (Qwen3-TTS-CustomVoice's real built-in presets), and an
            # implicit single-voice default has already silently masked
            # voice selection once (see docs/deployment.md's TTS voice
            # sections).
            - name: TTS_VOICES
              value: "Aiden,Ryan,Dylan,Eric,Ono_Anna,Serena,Sohee,Uncle_Fu,Vivian"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8002
          resources:
            # No GPU request here — this container rides on the Pod-level
            # grant from the speech-stt container above. If your device
            # plugin instead requires every container that touches the GPU
            # to declare its own request, this manifest will need MIG/
            # time-slicing configuration — see the "Next plan" section in
            # docs/deployment.md.
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: tts-models
              mountPath: /models
          # TTS warmup (Triton JIT-compile + CUDA graph capture) took ~6
          # minutes in standalone testing — generous failureThreshold here.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8002
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: stt-models
          hostPath:
            path: /mnt/local-fast/parakeet-model
            type: Directory
        - name: tts-models
          hostPath:
            path: /mnt/local-fast/tts-model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: speech-stt
  namespace: speech
spec:
  type: ClusterIP
  selector:
    app: speech-stt-tts
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: speech-tts
  namespace: speech
spec:
  type: ClusterIP
  selector:
    app: speech-stt-tts
  ports:
    - port: 8002
      targetPort: 8002
