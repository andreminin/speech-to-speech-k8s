# Phase A validation: confirm whether two SEPARATE pods, each requesting
# nvidia.com/gpu: 1, can both schedule onto node2 (which has exactly one
# physical GPU). Expected outcome under default (non-MIG, non-time-sliced)
# device-plugin behavior: gpu-coschedule-b stays Pending. If that's what you
# see, Option A (node2 = STT+TTS) must use
# k8s/stt/deployment-colocated-with-tts.yaml (one Pod, two containers, one
# GPU request) instead of two separate Deployments.
#
# Apply, check `kubectl get pods -n speech`, then delete both:
#   kubectl apply -f k8s/smoke/gpu-coschedule-test-node2.yaml
#   kubectl get pods -n speech -l test=gpu-coschedule
#   kubectl delete -f k8s/smoke/gpu-coschedule-test-node2.yaml
apiVersion: v1
kind: Pod
metadata:
  name: gpu-coschedule-a
  namespace: speech
  labels: { test: gpu-coschedule }
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: node2
  imagePullSecrets:
    - name: local-registry-cred
  containers:
    - name: hold-gpu
      image: local-registry:5000/cuda:12.9.1-cudnn-runtime-ubuntu24.04
      imagePullPolicy: IfNotPresent
      command: ["sleep", "300"]
      resources:
        limits:
          nvidia.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-coschedule-b
  namespace: speech
  labels: { test: gpu-coschedule }
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: node2
  imagePullSecrets:
    - name: local-registry-cred
  containers:
    - name: hold-gpu
      image: local-registry:5000/cuda:12.9.1-cudnn-runtime-ubuntu24.04
      imagePullPolicy: IfNotPresent
      command: ["sleep", "300"]
      resources:
        limits:
          nvidia.com/gpu: 1
