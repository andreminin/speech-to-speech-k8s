# Traefik as the cluster's Ingress controller. kubernetes/ingress-nginx was
# archived (March 2026, no further releases/security fixes) so it's not
# something to newly install - Traefik is actively maintained and speaks
# plain k8s `Ingress` objects natively, so any future HTTP-facing service
# just needs its own Ingress, not a new proxy.
#
# Deployed into the `speech` namespace (not a dedicated one) purely to reuse
# the existing `local-registry-cred` imagePullSecret without a second
# create-registry-secret.sh run - revisit if this cluster ever hosts
# multiple tenants/namespaces that would want their own ingress controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: speech
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: speech
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: speech
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: traefik
          image: local-registry:5000/traefik:v3.3
          imagePullPolicy: IfNotPresent
          args:
            - --entrypoints.websecure.address=:8443
            # Without this, the entrypoint still opportunistically completes
            # a TLS handshake (serving whatever cert it can find) but never
            # marks Ingress-provided routers as TLS-eligible, so every
            # request 404s despite the router/service looking fully healthy
            # in the API - cost a long debugging session to find, so it's
            # spelled out here deliberately.
            - --entrypoints.websecure.http.tls=true
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
          ports:
            - name: websecure
              containerPort: 8443
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: speech
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: websecure
      port: 8443
      targetPort: 8443
      nodePort: 30443
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
