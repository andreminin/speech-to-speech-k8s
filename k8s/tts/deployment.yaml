apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-tts
  namespace: speech
  labels:
    app: speech-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-tts
  template:
    metadata:
      labels:
        app: speech-tts
    spec:
      runtimeClassName: nvidia
      nodeName: node3   # model will be on node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-tts
          image: local-registry:5000/speech-tts:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_NAME
              value: "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
            - name: MODEL_CACHE_DIR
              value: "/models"
          ports:
            - containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /mnt/local-fast/tts-model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: speech-tts-service
  namespace: speech
spec:
  selector:
    app: speech-tts
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
