# Browser voice-chat UI - built from upstream huggingface/speech-to-speech's
# `demo/` app plus this repo's vendored, patched demo/Dockerfile, server.py
# and main.js (the /api/mcp/call proxy + local_time/global_internet_search
# tools - see speech-mcp/README.md and those files' header comments).
# Build with scripts/build-and-push.sh, or directly:
#   docker build -f demo/Dockerfile -t local-registry:5000/speech-demo:<tag> \
#     --build-context patches=demo /path/to/speech-to-speech-checkout/demo
#
# SPEECH_TO_SPEECH_URL must be the Ingress's externally-reachable wss://
# address, NOT a cluster-internal Service DNS name and NOT the plain
# ws://<node-ip>:30765 gateway NodePort - the browser dials this URL
# directly (client-side), and once this page is https:// a plain ws://
# target is blocked as mixed content. See k8s/traefik/ingress.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-demo
  namespace: speech
  labels:
    app: speech-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-demo
  template:
    metadata:
      labels:
        app: speech-demo
    spec:
      nodeName: node1   # CPU-only, same rationale as speech-gateway
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-demo
          image: local-registry:5000/speech-demo:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: SPEECH_TO_SPEECH_URL
              value: "wss://192.168.10.31:30443/v1/realtime"
            # Disabled so the first response is always an answer to what was
            # actually said, not upstream's default auto-greeting - makes
            # testing unambiguous. Remove this to restore the greeting.
            - name: STARTUP_GREETING
              value: ""
            # speech-mcp's Streamable HTTP endpoint, proxied by /api/mcp/call
            # (server.py) for the local_time/global_internet_search tools.
            - name: MCP_SERVER_URL
              value: "http://speech-mcp:8080/mcp"
          ports:
            - containerPort: 7860
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: speech-demo
  namespace: speech
spec:
  type: ClusterIP
  selector:
    app: speech-demo
  ports:
    - port: 7860
      targetPort: 7860
