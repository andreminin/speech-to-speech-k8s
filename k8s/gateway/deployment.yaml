apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-gateway
  namespace: speech
  labels:
    app: speech-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-gateway
  template:
    metadata:
      labels:
        app: speech-gateway
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      nodeName: node0   # CPU‑only, can run on control‑plane
      containers:
        - name: speech-gateway
          image: local-registry:5000/speech-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: STT_URL
              value: "http://speech-stt-service:8080"
            - name: LLM_URL
              value: "http://speech-llm-service:8080"
            - name: TTS_URL
              value: "http://speech-tts-service:8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: speech-gateway-service
  namespace: speech
spec:
  selector:
    app: speech-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30765   # or leave as ClusterIP and use port‑forward
  type: NodePort       # external access for client
