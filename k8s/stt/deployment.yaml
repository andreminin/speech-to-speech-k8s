apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-stt
  namespace: speech
  labels:
    app: speech-stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-stt
  template:
    metadata:
      labels:
        app: speech-stt
    spec:
      runtimeClassName: nvidia
      nodeName: node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-stt
          image: local-registry:5000/speech-stt:latest
          imagePullPolicy: IfNotPresent
          args:
            - --stt
            - whisper
            - --stt_model_name
            - /models
          env:
            - name: HF_HOME
              value: /models
          ports:
            - containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /mnt/local-fast/whisper-model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: speech-stt-service
  namespace: speech
spec:
  selector:
    app: speech-stt
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP