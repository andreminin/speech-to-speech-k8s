apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-tts
  namespace: speech
  labels:
    app: speech-tts
spec:
  replicas: 1  # no GPU failover with a single 16GB card per role — intentional, see docs/architecture.md
  selector:
    matchLabels:
      app: speech-tts
  template:
    metadata:
      labels:
        app: speech-tts
    spec:
      runtimeClassName: nvidia
      # PLACEMENT UNDETERMINED until the Phase D benchmark (see docs/benchmarks.md).
      # Defaulted to node2 (Option A: node2=STT+TTS, node3=LLM) as the first
      # trial. To switch to Option B (node2=STT, node3=LLM+TTS), change
      # nodeName to node3, the volumes[].persistentVolumeClaim.claimName to
      # models-node3, and re-check GPU co-scheduling per k8s/smoke/README.md.
      nodeName: node2
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-tts
          image: local-registry:5000/speech-tts:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tts-config
          ports:
            - containerPort: 8002
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /mnt/models/qwen3-tts
              subPath: qwen3-tts
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-node2
