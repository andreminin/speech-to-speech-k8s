apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-tts
  namespace: speech
  labels:
    app: speech-tts
spec:
  replicas: 1
  strategy:
    type: Recreate   # single node GPU - a surge pod could never schedule anyway
  selector:
    matchLabels:
      app: speech-tts
  template:
    metadata:
      labels:
        app: speech-tts
    spec:
      runtimeClassName: nvidia
      nodeName: node3   # model will be on node3
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-tts
          image: local-registry:5000/speech-tts:voicefix3
          imagePullPolicy: IfNotPresent
          env:
            - name: TTS_MODEL_NAME
              value: "/models"   # local dir, mounted below - avoids any HF Hub lookup
            - name: TTS_DEVICE
              value: "cuda"
            - name: TTS_BACKEND
              value: "torch"   # matches the safetensors checkpoint on disk, not a gguf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - containerPort: 8002
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
          startupProbe:
            httpGet:
              path: /healthz
              port: 8002
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /mnt/local-fast/tts-model
            type: Directory
