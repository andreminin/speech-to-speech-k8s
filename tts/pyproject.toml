[project]
name = "speech-tts"
version = "0.1.0"
description = "OpenAI-compatible /v1/audio/speech wrapper around faster-qwen3-tts (Qwen3-TTS), for use as speech-to-speech's remote TTS backend."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "numpy",
  "soundfile",
  "faster-qwen3-tts[ggml]>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
