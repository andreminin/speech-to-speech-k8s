[project]
name = "speech-stt"
version = "0.1.0"
description = "OpenAI-compatible /v1/audio/transcriptions wrapper around nano-parakeet (Parakeet-TDT), for use as speech-to-speech's remote STT backend."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.9",
  "numpy",
  "soundfile",
  "librosa>=0.10",
  "nano-parakeet>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
