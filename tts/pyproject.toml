[project]
name = "speech-tts"
version = "0.1.0"
description = "OpenAI-compatible /v1/audio/speech wrapper around faster-qwen3-tts (Qwen3-TTS), for use as speech-to-speech's remote TTS backend."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "numpy",
  "soundfile",
  "faster-qwen3-tts[ggml]>=0.4.0",
  # Pinned: transformers 5.17.0 refactored MimiConfig's RoPE params and
  # broke qwen_tts's compat shim (_transformers_compat.py) with
  # `AttributeError: 'MimiConfig' object has no attribute 'rope_theta'`.
  # Without a lockfile, an unrelated rebuild (no pyproject.toml change at
  # all) picked up 5.17.0 fresh from PyPI and broke model loading - pin
  # until qwen_tts/faster-qwen3-tts catches up.
  "transformers==5.16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
