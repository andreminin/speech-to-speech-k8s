apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-llm
  namespace: speech
  labels:
    app: speech-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-llm
  template:
    metadata:
      labels:
        app: speech-llm
    spec:
      runtimeClassName: nvidia
      nodeName: node2
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-llm
          image: local-registry:5000/llama-cpp-server-cuda:server-cuda
          imagePullPolicy: IfNotPresent
          env:
            - name: LLM_CTX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: LLM_CTX_SIZE
            - name: LLM_PARALLEL
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: LLM_PARALLEL
          args:
            - --model
            - /models/gemma-4-E4B-it-Q8_0.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --n-gpu-layers
            - "999"
            - -np
            - "$(LLM_PARALLEL)"
            - -c
            - "$(LLM_CTX_SIZE)"
            - -fa
            - "on"
            - --swa-full
          ports:
            - containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /mnt/local-fast/gemma-model
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: speech-llm-service
  namespace: speech
spec:
  selector:
    app: speech-llm
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP