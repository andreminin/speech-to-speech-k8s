apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-gateway
  namespace: speech
  labels:
    app: speech-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-gateway
  template:
    metadata:
      labels:
        app: speech-gateway
    spec:
      nodeName: node1   # CPU-only, gateway/lightweight workloads
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: speech-gateway
          image: local-registry:5000/speech-gateway:latest
          imagePullPolicy: IfNotPresent
          # upstream's parse_arguments() only takes the JSON-config path when
          # this is the single positional arg (no --host/--port alongside it)
          args:
            - serve
            - /etc/speech-to-speech/config.json
          ports:
            - containerPort: 8765
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/speech-to-speech
          # No /health route exists upstream (WS-only ASGI app) - tcpSocket
          # is the best available signal that the server is up and accepting
          # connections.
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
