# Placeholder for llama.cpp server args that benefit from being editable
# without a rollout of the Deployment spec itself.
#
# No LLM_HF_REPO key here: k8s/llm/deployment.yaml's args hardcode a local
# hostPath GGUF file (/models/gemma-4-E4B-it-Q8_0.gguf, downloaded once per
# docs/deployment.md Phase B), not an -hf pull, so a repo-id key would be
# dead config. If a future model swap moves back to -hf, add it back then.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
  namespace: speech
data:
  LLM_CTX_SIZE: "65536"
  LLM_PARALLEL: "2"
